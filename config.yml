languageCode: en-us
baseURL: "https://kathara.in/"
title: Kathara Sasikumar
paginate: 5
theme: PaperMod

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

#googleAnalytics: UA-123-45

minify:
  disableXML: true
  minifyOutput: true

params:
  env: production # to enable google analytics, opengraph, twitter-cards and schema.
  title: Kathara Sasikumar
  description: "This is Kathara"
  keywords: [Blog, Portfolio]
  author: Kathara Sasikumar
  # author: ["Me", "You"] # multiple authors
  #images: ["<link or path of image for opengraph, twitter-cards>"]
  DateFormat: "January 2, 2006"
  defaultTheme: auto # dark, light
  disableThemeToggle: false

  ShowReadingTime: true
  ShowShareButtons: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: false
  disableSpecial1stPost: false
  disableScrollToTop: false
  comments: false
  hidemeta: false
  hideSummary: false
  showtoc: false
  tocopen: false

  label:
    text: "Kathara Sasikumar"
   # icon: "images/coding.png"
   # iconHeight: 35

  homeInfoParams:
    Title: "Hi there 👋"
    Content: "I'm  **Kathara**"

    buttons:
      - name: Blogs
        url: blogs

  socialIcons:

    - name: twitter
      url: "https://twitter.com/Kathara18"
    - name: linkedin
      url: "https://www.linkedin.com/in/kathara-sasikumar-53a24419b/"
    - name: github
      url: "https://github.com/Katharaa"
    - name: gitlab
      url: "https://salsa.debian.org/kathara"
    - name: matrix
      url: "https://matrix.to/#/@kathara:matrix.org"


  cover:
    hidden: true # hide everywhere but not in structured data
    hiddenInList: true # hide on list pages and home
    hiddenInSingle: false # hide on single page


  editPost:
#    URL: "https://github.com/chanin-www/content"
#    Text: "Suggest Changes" # edit text
    URL: ""
    Text: "" # edit text
    appendFilePath: true # to append file path to Edit link

  # for search
  # https://fusejs.io/api/options.html
  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    keys: ["title", "permalink", "summary", "content"]
menu:
  main:
    - identifier: about
      name: About
      url: /about/
      weight: 4
    - identifier: blog
      name: Blogs
      url: /blogs/
      weight: 1

outputs:
  blogs:
    - HTML
    - RSS

